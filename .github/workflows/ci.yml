name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # The app crate (efsp) needs Windows' WebView2 to build; it's checked
      # in the Windows job. Everything else builds and tests here.
      - name: Clippy
        run: cargo clippy --workspace --exclude efsp --all-targets --locked -- -D warnings

      # Dev builds add experiment code behind the `dev-tools` feature.
      - name: Clippy (dev-tools)
        run: cargo clippy --workspace --exclude efsp --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude efsp --locked

      - name: Test (dev-tools)
        run: cargo test --workspace --exclude efsp --all-features --locked

  # The app crate and all Windows-only code (registry, netsh, Npcap) compile here.
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Tauri embeds the built UI, so the app crate needs dist/ to compile.
      - name: Build UI
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # Link-time only: wpcap.lib from the official Npcap SDK. The installer
      # does not bundle Npcap; users install it themselves.
      - name: Download Npcap SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\npcap-sdk.zip"
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.16.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne "F0A8BE7778EE3AE1B99BBBECB27A3FF0F6C111A4093F1C78C5C5A099607184DB") {
            throw "Npcap SDK checksum mismatch: $hash"
          }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\npcap-sdk"
          "LIBPCAP_LIBDIR=$env:RUNNER_TEMP\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV
          # Skip loading wpcap.dll at build time to detect the version.
          "LIBPCAP_VER=1.10.0" >> $env:GITHUB_ENV

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Clippy (release features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked
