name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      # The app crate (efsp) needs Windows' WebView2 to build; it's checked
      # in the Windows job. Everything else builds and tests here.
      - name: Clippy
        run: cargo clippy --workspace --exclude efsp --all-targets --locked -- -D warnings

      # Dev builds add experiment code behind the `dev-tools` feature.
      - name: Clippy (dev-tools)
        run: cargo clippy --workspace --exclude efsp --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude efsp --locked

      - name: Test (dev-tools)
        run: cargo test --workspace --exclude efsp --all-features --locked

  # The app crate and all Windows-only code (registry, netsh, Npcap) compile here.
  rust-windows:
    name: Rust (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      # Tauri embeds the built UI, so the app crate needs dist/ to compile.
      - name: Build UI
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked
