name: CI

on:
  push:
    branches: [main]
    # A version tag (v1.0.0, …) also publishes a draft GitHub Release.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# GitHub keeps one queued run per group and drops the rest, whatever
# cancel-in-progress says. Pull requests share a group per branch, so a new
# push replaces the old run; every push to main or a tag gets a group of its
# own, so each commit there finishes with a result (and an installer).
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  ui:
    name: UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and format check
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  rust:
    name: Rust (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all --check

      # On Linux the app crate (efsp) needs Tauri's webkit2gtk libraries; it's
      # built and checked in the Windows job instead.
      - name: Clippy
        run: cargo clippy --workspace --exclude efsp --all-targets --locked -- -D warnings

      # Dev builds add experiment code behind the `dev-tools` feature.
      - name: Clippy (dev-tools)
        run: cargo clippy --workspace --exclude efsp --all-targets --all-features --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --exclude efsp --locked

      - name: Test (dev-tools)
        run: cargo test --workspace --exclude efsp --all-features --locked

  # The app crate and all Windows-only code (registry, netsh, Npcap) compile here.
  rust-windows:
    name: Rust and installer (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm

      # Tauri embeds the built UI, so the app crate needs dist/ to compile.
      - name: Build UI
        run: |
          npm ci
          npm run build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Link-time only: wpcap.lib from the official Npcap SDK. The installer
      # does not bundle Npcap; users install it themselves.
      - name: Download Npcap SDK
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\npcap-sdk.zip"
          Invoke-WebRequest https://npcap.com/dist/npcap-sdk-1.16.zip -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          if ($hash -ne "F0A8BE7778EE3AE1B99BBBECB27A3FF0F6C111A4093F1C78C5C5A099607184DB") {
            throw "Npcap SDK checksum mismatch: $hash"
          }
          Expand-Archive $zip -DestinationPath "$env:RUNNER_TEMP\npcap-sdk"
          "LIBPCAP_LIBDIR=$env:RUNNER_TEMP\npcap-sdk\Lib\x64" >> $env:GITHUB_ENV
          # Skip loading wpcap.dll at build time to detect the version.
          "LIBPCAP_VER=1.10.0" >> $env:GITHUB_ENV

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Clippy (release features)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --all-features --locked

      # DB-IP Lite country/ASN databases, bundled into the installer for
      # offline location labels. Not committed. Cached per month so a
      # db-ip.com outage only matters on a month's first run; the downloaded
      # month and SHA-256 are printed and kept in SOURCE.txt.
      - name: Month key for the IP databases
        id: ipdb-month
        shell: bash
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"
      - name: Cache IP location databases
        id: ipdb-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: src-tauri/resources/ipdb
          key: dbip-lite-${{ steps.ipdb-month.outputs.month }}
      - name: Download IP location databases
        if: steps.ipdb-cache.outputs.cache-hit != 'true'
        run: node scripts/update-ip-data.mjs --geo
      - name: IP database versions
        shell: bash
        run: cat src-tauri/resources/ipdb/SOURCE.txt

      # The region-picker helper ships next to efsp.exe (Tauri externalBin
      # wants the target triple in the file name).
      - name: Build region-picker helper
        shell: bash
        run: |
          cargo build --release --locked -p efsp-helper
          mkdir -p src-tauri/binaries
          cp target/release/efsp-helper.exe src-tauri/binaries/efsp-helper-x86_64-pc-windows-msvc.exe

      # tauri.bundle.conf.json adds the IP databases and the helper to the
      # bundle (kept out of the base config so checks build without them).
      # Release features only: developer tools are for local builds.
      - name: Build installer (unsigned)
        run: npm run tauri build -- --config "${{ github.workspace }}/src-tauri/tauri.bundle.conf.json" -- --locked

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: efsp-windows-installer
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  # Tags only: a draft release with the installer, to check and publish by
  # hand. The only job that can write to the repository, and it runs no
  # third-party build code: it just uploads what the Windows job built.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ui, rust, rust-windows, audit]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: efsp-windows-installer
          path: installer

      # Release notes: this version's section of CHANGELOG.md.
      - name: Draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on && /^\[[^]]*\]: / { next }
            on { print }
          ' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" installer/*.exe \
            --repo "$GITHUB_REPOSITORY" --draft \
            --title "efsp $GITHUB_REF_NAME" --notes-file notes.md

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
      - name: npm audit
        run: npm audit --audit-level=high
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit
