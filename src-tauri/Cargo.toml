[package]
name = "efsp"
description = "efsp: the real connection behind eFootball's bars"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# The `_lib` suffix avoids a lib/bin name clash on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "efsp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
efsp-core = { path = "../crates/core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json = "1.0.154"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.2"
tauri-plugin-single-instance = "2.5.3"
maxminddb = "0.32.0"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.100"
netstat2 = "0.11.2"
pcap = "2.5"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
] }
runas = "1.2.0"
winreg = "0.56.0"

[features]
# Trace recorder, EFSP_REPLAY override and other developer tools, for local
# builds only (`--features dev-tools`). Release installers are built without.
dev-tools = ["efsp-core/dev-tools"]

[lints]
workspace = true
